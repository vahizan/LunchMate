AWSTemplateFormatVersion: '2010-09-09'
Description: 'FindMyLunch Application - Backend Infrastructure'

Parameters:
  EnvironmentName:
    Description: Environment name (qa or prod)
    Type: String
    Default: prod
    AllowedValues:
      - qa
      - prod
    ConstraintDescription: must be either qa or prod

  NodeJSVersion:
    Description: Node.js version for the Elastic Beanstalk platform
    Type: String
    Default: '22'
    AllowedValues:
      - '18'
      - '20'
      - '22'

  InstanceType:
    Description: EC2 instance type for the Elastic Beanstalk environment
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  MinInstances:
    Description: Minimum number of instances in the Auto Scaling group
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  MaxInstances:
    Description: Maximum number of instances in the Auto Scaling group
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 10

  DomainName:
    Description: Main domain name for the application
    Type: String
    Default: findmylunch.net

  HostedZoneId:
    Description: Route53 Hosted Zone ID for the domain
    Type: String

  SSLCertificateARN:
    Description: ARN of the SSL certificate for the load balancer
    Type: String

  SecretsManagerARN:
    Description: ARN of the Secrets Manager secret containing environment variables
    Type: String

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, 'prod']
  HasValidHostedZoneId: !Not [!Equals [!Ref HostedZoneId, 'UPDATE_WITH_CORRECT_HOSTED_ZONE_ID']]
  HasValidCertificate: !Not [!Or [!Equals [!Ref SSLCertificateARN, ''], !Equals [!Ref SSLCertificateARN, 'arn:aws:acm:us-east-1:123456789012:certificate/placeholder-needs-real-cert']]]

Resources:
  # IAM Role for Elastic Beanstalk Service
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService'
        - 'arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth'

  # IAM Role for EC2 Instances
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy'
        - 'arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore'

  # IAM Policy for Secrets Manager Access
  SecretsManagerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${EnvironmentName}-findmylunch-secrets-manager-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'secretsmanager:GetSecretValue'
              - 'secretsmanager:DescribeSecret'
            Resource: !Ref SecretsManagerARN
      Roles:
        - !Ref EC2Role

  # IAM Instance Profile for EC2 Instances
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # Elastic Beanstalk Application
  ElasticBeanstalkApplication:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Sub findmylunch-${EnvironmentName}
      Description: !Sub "FindMyLunch ${EnvironmentName} Backend Application"

  # Elastic Beanstalk Environment
  ElasticBeanstalkEnvironment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref ElasticBeanstalkApplication
      EnvironmentName: !Sub findmylunch-${EnvironmentName}
      Description: !Sub "FindMyLunch ${EnvironmentName} Backend Environment"
      SolutionStackName: !Sub "64bit Amazon Linux 2023 v6.5.2 running Node.js ${NodeJSVersion}"
      Tier:
        Name: WebServer
        Type: Standard
      OptionSettings:
        # VPC Configuration
        - Namespace: aws:ec2:vpc
          OptionName: VPCId
          Value: 
            Fn::ImportValue: !Sub ${EnvironmentName}-FindMyLunch-VPC
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: 
            Fn::ImportValue: !Sub ${EnvironmentName}-FindMyLunch-PrivateSubnets
        - Namespace: aws:ec2:vpc
          OptionName: ELBSubnets
          Value: 
            Fn::ImportValue: !Sub ${EnvironmentName}-FindMyLunch-PublicSubnets
        - Namespace: aws:ec2:vpc
          OptionName: AssociatePublicIpAddress
          Value: false

        # Load Balancer Configuration
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: LoadBalancerType
          Value: application
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref ServiceRole
        - Namespace: aws:elbv2:loadbalancer
          OptionName: SecurityGroups
          Value: 
            Fn::ImportValue: !Sub ${EnvironmentName}-FindMyLunch-ALBSecurityGroup
        - Namespace: aws:elbv2:listener:default
          OptionName: Protocol
          Value: HTTP
        # HTTPS listener removed - CloudFront handles HTTPS termination

        # Health Check Configuration
        - Namespace: aws:elasticbeanstalk:environment:process:default
          OptionName: HealthCheckPath
          Value: /health
        - Namespace: aws:elasticbeanstalk:environment:process:default
          OptionName: HealthCheckInterval
          Value: 15
        - Namespace: aws:elasticbeanstalk:environment:process:default
          OptionName: MatcherHTTPCode
          Value: 200-299

        # Instance Configuration
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref InstanceProfile
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: SecurityGroups
          Value: 
            Fn::ImportValue: !Sub ${EnvironmentName}-FindMyLunch-EC2SecurityGroup
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: !Ref InstanceType
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: DisableIMDSv1
          Value: true

        # Auto Scaling Configuration
        - Namespace: aws:autoscaling:asg
          OptionName: MinSize
          Value: !Ref MinInstances
        - Namespace: aws:autoscaling:asg
          OptionName: MaxSize
          Value: !Ref MaxInstances
        - Namespace: aws:autoscaling:trigger
          OptionName: MeasureName
          Value: CPUUtilization
        - Namespace: aws:autoscaling:trigger
          OptionName: Unit
          Value: Percent
        - Namespace: aws:autoscaling:trigger
          OptionName: UpperThreshold
          Value: 75
        - Namespace: aws:autoscaling:trigger
          OptionName: LowerThreshold
          Value: 40

        # Application Environment
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: NODE_ENV
          Value: !If [IsProduction, 'prod', 'development']
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: SECRETS_MANAGER_ARN
          Value: !Ref SecretsManagerARN
        - Namespace: aws:elasticbeanstalk:application:environment
          OptionName: AWS_REGION
          Value: !Ref AWS::Region

        # Enhanced Health Reporting
        - Namespace: aws:elasticbeanstalk:healthreporting:system
          OptionName: SystemType
          Value: enhanced

        # Deployment Policy
        - Namespace: aws:elasticbeanstalk:command
          OptionName: DeploymentPolicy
          Value: Rolling
        - Namespace: aws:elasticbeanstalk:command
          OptionName: BatchSizeType
          Value: Fixed
        - Namespace: aws:elasticbeanstalk:command
          OptionName: BatchSize
          Value: 1

        # Logs
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: StreamLogs
          Value: true
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: DeleteOnTerminate
          Value: !If [IsProduction, false, true]
        - Namespace: aws:elasticbeanstalk:cloudwatch:logs
          OptionName: RetentionInDays
          Value: !If [IsProduction, 90, 7]

        # Node.js Platform Options
        - Namespace: aws:elasticbeanstalk:container:nodejs
          OptionName: ProxyServer
          Value: nginx

 # Sample Application Version
  ApplicationVersionResource:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    Properties:
      ApplicationName: !Ref ElasticBeanstalkApplication
      Description: Initial Version
      SourceBundle: 
        S3Bucket: !Sub "elasticbeanstalk-samples-${AWS::Region}"
        S3Key: nodejs-sample.zip
   
  # API Gateway REST API
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${EnvironmentName}-findmylunch-api"
      Description: !Sub "API Gateway for FindMyLunch ${EnvironmentName} Backend"
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-findmylunch-api"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: FindMyLunch

  # API Gateway Resource for proxy all requests
  ApiGatewayProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: "{proxy+}"

  # API Gateway Method for ANY request
  ApiGatewayProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub "http://${ElasticBeanstalkEnvironment.EndpointURL}/{proxy}"
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy
        ConnectionType: INTERNET
        TimeoutInMillis: 29000
      RequestParameters:
        method.request.path.proxy: true

  # API Gateway Method for root path
  ApiGatewayRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub "http://${ElasticBeanstalkEnvironment.EndpointURL}/"
        ConnectionType: INTERNET
        TimeoutInMillis: 29000

  # API Gateway Deployment
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayProxyMethod
      - ApiGatewayRootMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: !Sub "Deployment for ${EnvironmentName} environment"

  # API Gateway Stage
  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref EnvironmentName
      Description: !Sub "Stage for ${EnvironmentName} environment"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-findmylunch-api-stage"
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: FindMyLunch

  # API Gateway Base Path Mapping
  ApiGatewayBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasValidCertificate
    Properties:
      DomainName: !Sub "api.${DomainName}"
      RestApiId: !Ref ApiGatewayRestApi
      Stage: !Ref ApiGatewayStage

  # Route 53 Record for API Domain (pointing to API Gateway)
  ApiDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasValidHostedZoneId
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "api.${DomainName}"
      Type: A
      AliasTarget:
        HostedZoneId: !FindInMap [RegionMap, !Ref "AWS::Region", APIGatewayHostedZoneId]
        DNSName: !Sub "api.${DomainName}"
# Mappings for API Gateway hosted zone IDs by region
Mappings:
  RegionMap:
    us-east-1:
      APIGatewayHostedZoneId: Z1UJRXOUMOOFQ8
    us-east-2:
      APIGatewayHostedZoneId: ZOJJZC49E0EPZ
    us-west-1:
      APIGatewayHostedZoneId: Z2MUQ32089INYE
    us-west-2:
      APIGatewayHostedZoneId: Z2OJLYMUO9EFXC
    eu-west-1:
      APIGatewayHostedZoneId: ZLY8HYME6SFDD
    eu-west-2:
      APIGatewayHostedZoneId: ZJ5UAJN8Y3Z2Q
    eu-central-1:
      APIGatewayHostedZoneId: Z1U9ULNL0V5AJ3
    ap-northeast-1:
      APIGatewayHostedZoneId: Z1YSHQZHG15GKL
    ap-northeast-2:
      APIGatewayHostedZoneId: Z20JF4UZKIW1U8
    ap-southeast-1:
      APIGatewayHostedZoneId: ZL327KTPIQFUL
    ap-southeast-2:
      APIGatewayHostedZoneId: Z2RPCDW04V8134
    ap-south-1:
      APIGatewayHostedZoneId: Z3VO1THU9YC4UR
    sa-east-1:
      APIGatewayHostedZoneId: ZCMLWB8V5SYIT

Outputs:
  ElasticBeanstalkApplicationName:
    Description: Name of the Elastic Beanstalk application
    Value: !Ref ElasticBeanstalkApplication
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-EBApplicationName"

  ElasticBeanstalkEnvironmentName:
    Description: Name of the Elastic Beanstalk environment
    Value: !Ref ElasticBeanstalkEnvironment
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-EBEnvironmentName"

  ElasticBeanstalkEnvironmentURL:
    Description: URL of the Elastic Beanstalk environment
    Value: !GetAtt ElasticBeanstalkEnvironment.EndpointURL
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-EBEnvironmentURL"

  ApiEndpoint:
    Condition: HasValidHostedZoneId
    Description: API endpoint URL (via API Gateway)
    Value: !Sub "https://api.${DomainName}"
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-ApiEndpoint"
  
  ApiGatewayEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-ApiGatewayEndpoint"
  
  ElasticBeanstalkEndpoint:
    Description: Elastic Beanstalk endpoint URL (direct access, bypassing API Gateway)
    Value: !GetAtt ElasticBeanstalkEnvironment.EndpointURL
    Export:
      Name: !Sub "${EnvironmentName}-FindMyLunch-EBEndpoint"
